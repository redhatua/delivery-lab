- name: Agent ssh keypair
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N "" -C lab-agent -f {{ secrets_dir }}/agent-ssh-key
  args:
    creates: "{{ secrets_dir }}/agent-ssh-key"
  delegate_to: localhost

- name: Agent sshd host key (fixed so the controller can verify it)
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N "" -C lab-agent-host -f {{ secrets_dir }}/agent-host-key
  args:
    creates: "{{ secrets_dir }}/agent-host-key"
  delegate_to: localhost

- name: Host key in known_hosts line form
  ansible.builtin.shell: cut -d' ' -f1,2 {{ secrets_dir }}/agent-host-key.pub | tr -d '\n' > {{ secrets_dir }}/agent-host-key-line
  args:
    creates: "{{ secrets_dir }}/agent-host-key-line"
  delegate_to: localhost

- name: Jenkins admin password
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=24') }}"
    dest: "{{ secrets_dir }}/jenkins-admin-password"
    mode: "0600"
    force: false
  delegate_to: localhost
  no_log: true
